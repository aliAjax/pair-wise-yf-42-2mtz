<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>动物园谱系与繁育协调</title>
  <style>
    :root { --line:#e5e7eb; --muted:#6b7280; --danger:#b91c1c; --danger-bg:#fef2f2;
            --warn:#92400e; --warn-bg:#fffbeb; --ok:#065f46; --ok-bg:#ecfdf5; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           margin: 2rem; color: #1f2937; background:#f9fafb; }
    main { max-width: 1080px; margin: auto; }
    h1 { margin-bottom: .25rem; }
    .muted { color: var(--muted); font-size: .9rem; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap:1rem; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
    section, .card { background:#fff; border:1px solid var(--line); border-radius:10px;
                     padding:1rem 1.25rem; margin-bottom:1rem; }
    h2 { font-size:1.05rem; margin:0 0 .75rem; }
    h3 { font-size:.95rem; margin:0; }
    button { padding:.4rem .7rem; cursor:pointer; border:1px solid #9ca3af;
             background:#fff; border-radius:6px; font-size:.85rem; }
    button.primary { background:#111827; color:#fff; border-color:#111827; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    input, select { padding:.4rem .5rem; border:1px solid #d1d5db; border-radius:6px;
                    font-size:.85rem; min-width:0; }
    label { font-size:.8rem; color:var(--muted); display:flex; flex-direction:column; gap:.25rem; }
    .row { display:flex; gap:.5rem; align-items:flex-end; flex-wrap:wrap; }
    .card { margin-bottom:.75rem; }
    .badge { display:inline-block; padding:.1rem .55rem; border-radius:999px;
             font-size:.75rem; font-weight:600; }
    .b-active, .b-authorized, .b-approved, .b-completed { background:var(--ok-bg); color:var(--ok); }
    .b-proposed, .b-planned, .b-in_transit { background:var(--warn-bg); color:var(--warn); }
    .b-invalidated, .b-deceased, .b-rejected, .b-quarantined { background:var(--danger-bg); color:var(--danger); }
    .reason { margin-top:.5rem; padding:.5rem .75rem; background:var(--danger-bg);
              border:1px solid #fecaca; color:var(--danger); border-radius:6px; font-size:.85rem; }
    .reason code { font-size:.8rem; }
    #flash { position:sticky; top:0; margin-bottom:1rem; }
    .flash-ok { background:var(--ok-bg); border:1px solid #a7f3d0; color:var(--ok); }
    .flash-err { background:var(--danger-bg); border:1px solid #fecaca; color:var(--danger); }
    .flash { padding:.6rem .9rem; border-radius:8px; font-size:.88rem; white-space:pre-wrap; }
    pre { font-size:.75rem; background:#f3f4f6; padding:.5rem; border-radius:6px;
          overflow-x:auto; margin:.5rem 0 0; }
    .meta { font-size:.78rem; color:var(--muted); margin:.35rem 0; }
    .actions { margin-top:.6rem; display:flex; gap:.4rem; flex-wrap:wrap; }
    .mini { font-size:.75rem; padding:.2rem .5rem; }
  </style>
</head>
<body>
<main>
  <h1>动物园谱系与繁育协调</h1>
  <p class="muted">
    配对批准使用乐观版本：两人同时批准只有一人成功，后到者看到版本冲突。
    个体状态或谱系更新后，未执行的批准自动失效并显示原因；运输失败后可从已完成步骤重试，副作用不重复。
  </p>

  <div id="flash"></div>

  <section>
    <h2>身份</h2>
    <div class="row">
      <label>用户 <input id="userId" value="admin" size="10"></label>
      <label>角色
        <select id="role">
          <option value="admin">admin</option>
          <option value="coordinator">coordinator</option>
          <option value="registrar">registrar</option>
          <option value="veterinarian">veterinarian</option>
          <option value="viewer">viewer</option>
        </select>
      </label>
      <button onclick="loadAll()">刷新</button>
    </div>
  </section>

  <div class="grid">
    <div>
      <section>
        <h2>登记个体</h2>
        <div class="row">
          <label>名称 <input id="animalName" size="10"></label>
          <label>性别
            <select id="animalSex">
              <option value="female">female</option>
              <option value="male">male</option>
              <option value="unknown">unknown</option>
            </select>
          </label>
          <button class="primary" onclick="createAnimal()">创建个体</button>
        </div>
      </section>
      <section>
        <h2>个体</h2>
        <div id="animals"></div>
      </section>
      <section>
        <h2>配对建议</h2>
        <button class="primary" onclick="createPairing()">新建配对建议</button>
        <div id="pairings" style="margin-top:.75rem"></div>
      </section>
    </div>
    <div>
      <section>
        <h2>批准配对（带版本）</h2>
        <div class="row">
          <label>配对 <input id="approvePairing" size="22"></label>
          <label>父本 <input id="approveSire" size="22"></label>
          <label>母本 <input id="approveDam" size="22"></label>
        </div>
        <div class="row" style="margin-top:.5rem">
          <label>期望版本 <input id="approveVersion" type="number" value="1" style="width:6rem"></label>
          <label>会签 <input id="approveApprovals" value="vet-1" size="14"></label>
          <button class="primary" onclick="submitApprove(false)">提交批准</button>
          <button onclick="submitApprove(true)">重新批准</button>
        </div>
        <p class="meta">两个页面同时用相同“期望版本”提交时，先到者成功，后到者收到 409 版本冲突，刷新版本后重试。</p>
      </section>
      <section>
        <h2>运输记录</h2>
        <button onclick="loadTransfers()">刷新运输</button>
        <div id="transfers" style="margin-top:.75rem"></div>
      </section>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);

function headers() {
  return {"Content-Type": "application/json",
          "X-User-Id": $("userId").value || "anonymous",
          "X-Role": $("role").value};
}

function flash(message, ok) {
  const el = $("flash");
  el.innerHTML = '<div class="flash ' + (ok ? "flash-ok" : "flash-err") + '"></div>';
  el.firstChild.textContent = message;
  clearTimeout(flash._t);
  flash._t = setTimeout(() => { el.innerHTML = ""; }, 8000);
}

async function api(method, path, body) {
  const response = await fetch(path, {
    method, headers: headers(),
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let payload = null;
  try { payload = await response.json(); } catch (_) {}
  if (!response.ok) {
    const err = new Error(payload && payload.error ? payload.error : ("HTTP " + response.status);
    err.payload = payload;
    err.status = response.status;
    throw err;
  }
  return payload;
}

function esc(value) {
  return String(value == null ? "" : value).replace(/[&<>"]/g, (c) =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

function badge(status) {
  return '<span class="badge b-' + esc(status) + '">' + esc(status) + "</span>";
}

async function createAnimal() {
  try {
    await api("POST", "/api/animals",
      {name: $("animalName").value || ("A-" + Date.now()), sex: $("animalSex").value});
    flash("个体已创建", true);
    await loadAll();
  } catch (err) { flash(err.message); }
}

async function createPairing() {
  try {
    const pairing = await api("POST", "/api/pairings", {proposed_by: $("userId").value});
    $("approvePairing").value = pairing.id;
    $("approveVersion").value = pairing.version;
    flash("配对建议已创建：" + pairing.id, true);
    await loadPairings();
  } catch (err) { flash(err.message); }
}

async function submitApprove(reapprove) {
  const pairingId = $("approvePairing").value.trim();
  if (!pairingId) return flash("请填写配对 ID");
  const action = reapprove ? "reapprove" : "approve";
  const body = {
    action,
    expected_version: Number($("approveVersion").value),
    data: {sire_id: $("approveSire").value.trim(),
           dam_id: $("approveDam").value.trim(),
           approvals: $("approveApprovals").value.split(",").map(s => s.trim()).filter(Boolean)},
  };
  try {
    const updated = await api("POST", "/api/entities/" + encodeURIComponent(pairingId) + "/actions", body);
    flash((reapprove ? "重新" : "") + "批准成功，新版本 " + updated.version + "，状态 " + updated.status, true);
    $("approveVersion").value = updated.version;
    await loadAll();
  } catch (err) {
    if (err.status === 409 && err.payload && err.payload.details) {
      const d = err.payload.details;
      flash("版本冲突：你基于版本 " + d.expected_version + "，当前已是版本 " +
            d.current_version + "。\n请刷新对象、查看新状态后用新版本重试。\n" + err.message);
    } else {
      flash(err.message);
    }
  }
}

function invalidationBlock(data) {
  const inv = data && data.invalidated;
  if (!inv) return "";
  return '<div class="reason"><strong>批准已失效：</strong>' + esc(inv.message || inv.code) +
    ' <code>(' + esc(inv.code) + ")</code>" +
    (data.invalidated_at ? '<div class="meta">失效时间：' + esc(data.invalidated_at) + "</div>" : "") +
    "</div>";
}

function renderAnimals(items) {
  $("animals").innerHTML = items.map((a) => {
    const occupied = a.data.occupied_by
      ? '<div class="meta">占用中：' + esc(a.data.occupied_by) + "</div>" : "";
    return '<div class="card"><h3>' + esc(a.data.name) + " " + badge(a.status) +
      ' <span class="meta">v' + a.version + "</span></h3>" +
      '<div class="meta">' + esc(a.id) + " · " + esc(a.data.sex) +
      (a.data.sire_id ? " · 父:" + esc(a.data.sire_id) : "") +
      (a.data.dam_id ? " · 母:" + esc(a.data.dam_id) : "") + "</div>" + occupied +
      '<div class="actions">' +
      '<button class="mini" onclick="animalAction(\'' + esc(a.id) + '\',\'quarantine_animal\',{reason:\'观察\'})">隔离</button>' +
      '<button class="mini" onclick="animalAction(\'' + esc(a.id) + '\',\'release_quarantine\',{})">解除隔离</button>' +
      '<button class="mini" onclick="markDeceased(\'' + esc(a.id) + '\')">标记死亡</button>' +
      '<button class="mini" onclick="useForApprove(\'' + esc(a.id) + '\')">用于批准</button>' +
      "</div></div>";
  }).join("") || '<p class="muted">暂无个体</p>';
}

function useForApprove(id) {
  const sire = $("approveSire").value.trim();
  if (!sire) $("approveSire").value = id;
  else if (!$("approveDam").value.trim()) $("approveDam").value = id;
}

async function markDeceased(id) {
  const cause = prompt("死亡原因", "old age");
  if (cause === null) return;
  try { await api("POST", "/api/entities/" + encodeURIComponent(id) + "/actions",
                 {action: "mark_deceased", data: {cause}});
    flash("已标记死亡；关联的未执行批准将自动失效", true); await loadAll();
  } catch (err) { flash(err.message); }
}

async function animalAction(id, action, data) {
  try { await api("POST", "/api/entities/" + encodeURIComponent(id) + "/actions",
                 {action, data});
    flash("个体操作完成；关联的未执行批准将自动失效", true); await loadAll();
  } catch (err) { flash(err.message); }
}

function renderPairings(items) {
  $("pairings").innerHTML = items.map((p) => {
    return '<div class="card"><h3>' + esc(p.id.slice(0,8)) + "… " + badge(p.status) +
      ' <span class="meta">v' + p.version + "</span></h3>" +
      '<div class="meta">父本: ' + esc(p.data.sire_id || "—") + "<br>母本: " +
      esc(p.data.dam_id || "—") +
      (p.data.approval_basis ? "<br>亲缘系数: " + esc(p.data.approval_basis.inbreeding) : "") +
      (p.data.offspring_ids ? "<br>后代: " + esc((p.data.offspring_ids || []).join(", ")) : "") +
      "</div>" + invalidationBlock(p.data) +
      '<div class="actions">' +
      '<button class="mini" onclick="fillApprove(\'' + esc(p.id) + '\',' + p.version + ')">填入批准</button>' +
      (p.status === "invalidated"
        ? '<button class="mini primary" onclick="reapprove(\'' + esc(p.id) + '\',' + p.version + ')">重新批准</button>' : "") +
      (p.status === "approved"
        ? '<button class="mini primary" onclick="completePairing(\'' + esc(p.id) + '\',' + p.version + ')">完成并登记后代</button>' : "") +
      "</div></div>";
  }).join("") || '<p class="muted">暂无配对</p>';
}

function fillApprove(id, version) {
  $("approvePairing").value = id;
  $("approveVersion").value = version;
}

async function reapprove(id, version) {
  $("approvePairing").value = id;
  $("approveVersion").value = version;
  submitApprove(true);
}

async function completePairing(id, version) {
  const name = prompt("后代名称", "O-" + id.slice(0, 6));
  if (name === null) return;
  try {
    const updated = await api("POST", "/api/entities/" + encodeURIComponent(id) + "/actions",
      {action: "complete", expected_version: version,
       data: {offspring: [{name, sex: "unknown"}]}});
    flash("配对完成，后代已登记：" + (updated.data.offspring_ids || []).join(", "), true);
    await loadAll();
  } catch (err) { showActionError(err); }
}

function showActionError(err) {
  if (err.status === 422 && err.payload && err.payload.details) {
    const reason = err.payload.details.reason || {};
    flash("无法继续，批准已失效：" + (reason.message || reason.code) +
      "\n代码：" + reason.code +
      (reason.animal_id ? "\n相关个体：" + reason.animal_id : "") +
      "\n已完成的步骤保留；恢复条件后重新批准，再从当前步骤继续。");
  } else if (err.status === 409 && err.payload && err.payload.details) {
    const d = err.payload.details;
    flash("版本冲突：期望 " + d.expected_version + "，当前 " + d.current_version + "，请刷新后重试。");
  } else {
    flash(err.message);
  }
}

function renderTransfers(items) {
  $("transfers").innerHTML = items.map((t) => {
    const next = {planned: ["authorize"], authorized: ["ship"],
                  in_transit: ["arrive"], completed: []}[t.status] || [];
    const buttons = next.map((action) => {
      const label = {authorize:"授权", ship:"发运", arrive:"到达"}[action];
      return '<button class="mini primary" onclick="transferAction(\'' +
        esc(t.id) + '\',\'' + action + '\')">' + label + "</button>";
    }).join("");
    return '<div class="card"><h3>' + esc(t.id.slice(0,8)) + "… " + badge(t.status) +
      ' <span class="meta">v' + t.version + "</span></h3>" +
      '<div class="meta">个体: ' + esc(t.data.animal_id) + "<br>" +
      esc(t.data.from_institution) + " → " + esc(t.data.to_institution) +
      (t.data.pairing_id ? "<br>配对: " + esc(t.data.pairing_id) : "") + "</div>" +
      '<div class="actions">' + buttons +
      '<button class="mini" onclick="loadSteps(\'' + esc(t.id) + '\')">查看步骤台账</button>' +
      "</div><pre id='steps-" + esc(t.id) + "'></pre></div>";
  }).join("") || '<p class="muted">暂无运输记录（可通过 API 创建）</p>';
}

async function transferAction(id, action) {
  let data = {};
  if (action === "authorize") data = {permit_id: prompt("许可证号", "P-" + Date.now())};
  else if (action === "ship") data = {transport_id: prompt("运单号", "T-" + Date.now())};
  else if (action === "arrive") data = {arrival_date: new Date().toISOString().slice(0, 10)};
  if (Object.values(data).some((v) => v === null)) return;
  try {
    const updated = await api("POST", "/api/entities/" + encodeURIComponent(id) + "/actions",
      {action, data});
    flash("步骤 " + action + " 完成，状态 " + updated.status + "；重试已完成步骤不会重复登记或占用", true);
    await loadAll();
  } catch (err) { showActionError(err); await loadAll(); }
}

async function loadSteps(id) {
  const payload = await api("GET", "/api/entities/" + encodeURIComponent(id) + "/steps");
  $("steps-" + id).textContent = JSON.stringify(
    payload.items.map((s) => s.step_key + " → " + s.status), null, 2);
}

async function loadAnimals() { renderAnimals((await api("GET", "/api/animals")).items); }
async function loadPairings() { renderPairings((await api("GET", "/api/pairings")).items); }
async function loadTransfers() { renderTransfers((await api("GET", "/api/transfers")).items); }
async function loadAll() {
  try {
    const [animals, pairings, transfers] = await Promise.all(
      [api("GET", "/api/animals"), api("GET", "/api/pairings"), api("GET", "/api/transfers")]);
    renderAnimals(animals.items);
    renderPairings(pairings.items);
    renderTransfers(transfers.items);
  } catch (err) { flash(err.message); }
}

loadAll();
</script>
</body>
</html>
